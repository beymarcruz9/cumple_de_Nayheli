  <script>
    const canvas = document.getElementById('canvas-fx'); const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    const particles = []; const colors = ['#f472b6', '#fb7185', '#34d399', '#38bdf8'];
    class Particle {
      constructor() { this.reset(); }
      reset() { this.x = Math.random() * canvas.width; this.y = -20; this.size = Math.random() * 8 + 4; this.speedY = Math.random() * 2 + 1; this.speedX = Math.sin(this.y * 0.05) * 1.5; this.color = colors[Math.floor(Math.random() * colors.length)]; this.rotation = Math.random() * 360; this.rotSpeed = (Math.random() - 0.5) * 4; }
      update() { this.y += this.speedY; this.x += Math.sin(this.y * 0.02); this.rotation += this.rotSpeed; if (this.y > canvas.height + 20) this.reset(); }
      draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate((this.rotation * Math.PI) / 180); ctx.fillStyle = this.color; ctx.beginPath(); ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    }
    for (let i = 0; i < 35; i++) { const p = new Particle(); p.y = Math.random() * canvas.height; particles.push(p); }
    function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
    animate();
  </script>
